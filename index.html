<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wen Jiayi</title>
  <script>
    window.__pageStartTime = performance.now();
  </script>
  <style>
    :root {
      --bg-top: #d194a1;
      --bg-bottom: #fccfd9;
      --light-key: #fcf0f0;
      --light-fill: #aaccff;
      --light-ambient: #ffcab1;
      --outline: #532b2b;
      --material-fallback: #ffffff;
      --clear: #000000;
      --blur-radius: 2px;
      --noise-opacity: 0.05;
      --saturation: 0.9999;
      --brightness: 1.02;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(to bottom, var(--bg-top) 0%, var(--bg-bottom) 100%);
      background-attachment: fixed;
      background-size: cover;
      cursor: default;
    }

    canvas {
      display: block;
    }

    /* 鼠标跟随毛玻璃 */
    #blur-layer {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      backdrop-filter: blur(var(--blur-radius)) saturate(var(--saturation)) brightness(var(--brightness));
      -webkit-backdrop-filter: blur(var(--blur-radius)) saturate(var(--saturation)) brightness(var(--brightness));
    }

    #blur-layer::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: var(--noise-opacity);
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      background-repeat: repeat;
      background-size: 300px 300px;
    }

    /* ★★★ 加载模糊层（初始全屏模糊） ★★★ */
    #load-blur-layer {
      position: fixed;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      opacity: 1;
    }

    #load-blur-layer.cleared {
      opacity: 0;
    }

    /* 序列帧 */
    #sprite-layer {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 10;
      pointer-events: none;
      display: none;
      will-change: transform;
    }

    #sprite-canvas {
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ======黑胶唱片播放器====== */
    .record-player {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 4;
      /* 模糊层是5 越大越上层*/
      cursor: pointer;
      user-select: none;
      width: 56px;
      height: 56px;
    }

    .record {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      position: relative;
      box-shadow: 2px 4px 13px rgba(0, 0, 0, 0.606);
      animation: recordRotate 6s linear infinite;
      animation-play-state: paused;
      overflow: hidden;
      /* 裁剪伪元素，保持圆形 */
      background: transparent;
      /* 父容器清空背景，渐变放到伪元素 */
    }

    /* 唱片盘面渐变，跟着一起旋转 */
    .record::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg,#3a3434, #000000);
    }

    /* 唱片中心彩色标签圈 */
    .record::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 42%;
      height: 42%;
      border-radius: 50%;
      background: linear-gradient(135deg, #3986e6, #f34b7d);
    }

    .record-player.playing .record {
      animation-play-state: running;
    }

    @keyframes recordRotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* ==========新增悬浮提示文字 无框无背景========== */
    .record-player .tip-text {
      position: absolute;
      left: 64px;
      top: 50px;
      transform: translateY(-50%);
      color: #ffe9e9e5;
      font-size: 14px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.26);
    }

    .record-player:hover .tip-text {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div id="blur-layer"></div>
  <!-- ★★★ 加载模糊层 ★★★ -->
  <div id="load-blur-layer"></div>
  <div id="sprite-layer">
    <canvas id="sprite-canvas"></canvas>
  </div>
  <!-- ===== BGM唱片播放器（z-index:10 和序列帧同层）===== -->
  <div class="record-player" id="recordPlayer">
    <div class="record">
      <div class="center-dot"></div>
    </div>
    <!-- 新增悬浮文字 -->
    <div class="tip-text">点击播放/暂停BGM</div>
  </div>


  <audio id="bgm" src="music.mp3" loop preload="auto">
    <script>
      const player = document.getElementById("recordPlayer");
      const bgm = document.getElementById("bgm");
      let isPlaying = false;
      player.onclick = () => {
        if (!isPlaying) {
          bgm.play().then(() => {
            player.classList.add("playing");
            isPlaying = true;
          })
        } else {
          bgm.pause();
          player.classList.remove("playing");
          isPlaying = false;
        }
      }
    </script>
    <script>
      const BLUR = {
        enabled: true,
        innerRadius: 150,
        outerRadius: 400,
      };
      const blurLayer = document.getElementById('blur-layer');
      function updateBlurMask(clientX, clientY) {
        if (!BLUR.enabled) {
          blurLayer.style.maskImage = 'none';
          blurLayer.style.webkitMaskImage = 'none';
          return;
        }
        const inner = BLUR.innerRadius;
        const outer = BLUR.outerRadius;
        const mask = `radial-gradient(circle at ${clientX}px ${clientY}px, ` +
          `transparent 0px, transparent ${inner}px, black ${outer}px)`;
        blurLayer.style.maskImage = mask;
        blurLayer.style.webkitMaskImage = mask;
      }
      updateBlurMask(window.innerWidth / 2, window.innerHeight / 2);
      window.addEventListener('mousemove', (e) => {
        updateBlurMask(e.clientX, e.clientY);
      });
      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          const t = e.touches[0];
          updateBlurMask(t.clientX, t.clientY);
        }
      }, { passive: true });
    </script>
    <!-- ★★★ 加载模糊控制 ★★★ -->
    <script>
      const LOAD_BLUR = {
        blur: 17,                      // 初始模糊强度（px）
        tint: 'rgba(255, 255, 255, 0.05)', // 覆盖色
        fadeDuration: 1.2,             // 淡出时长（秒）
        fadeDelay: 0.2,                // 模型加载完后再延迟多久淡出（秒）
      };
      const loadBlurEl = document.getElementById('load-blur-layer');
      loadBlurEl.style.backdropFilter = `blur(${LOAD_BLUR.blur}px)`;
      loadBlurEl.style.webkitBackdropFilter = `blur(${LOAD_BLUR.blur}px)`;
      loadBlurEl.style.background = LOAD_BLUR.tint;
      loadBlurEl.style.transition = `opacity ${LOAD_BLUR.fadeDuration}s ease`;
      function clearLoadBlur() {
        setTimeout(() => {
          loadBlurEl.classList.add('cleared');
          console.log('加载模糊开始淡出（' + LOAD_BLUR.fadeDuration + 's）');
          setTimeout(() => {
            loadBlurEl.style.display = 'none';
            console.log('加载模糊已移除');
          }, LOAD_BLUR.fadeDuration * 1000 + 100);
        }, LOAD_BLUR.fadeDelay * 1000);
      }
      window.clearLoadBlur = clearLoadBlur;
      window.LOAD_BLUR = LOAD_BLUR;
    </script>
    <script>
      window.__spriteDoneFlag = false;
      window.__onSpriteDone = null;
      const SPRITE = {
        folder: './title_3D/',
        frameCount: 12,
        prefix: 'frame_',
        ext: '.png',
        pad: 5,
        fps: 11,
        loop: false,
        offsetX: 0,
        offsetY: 160,
        scale: 0.155,
        fadeIn: 0.3,
      };
      window.SPRITE = SPRITE;
      (function () {
        const layer = document.getElementById('sprite-layer');
        const canvas = document.getElementById('sprite-canvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        function applyTransform() {
          layer.style.transform =
            `translate(-50%, -50%) translate(${SPRITE.offsetX}px, ${SPRITE.offsetY}px) scale(${SPRITE.scale})`;
        }
        applyTransform();
        window.updateSpriteTransform = applyTransform;
        function framePath(i) {
          return SPRITE.folder + SPRITE.prefix + String(i).padStart(SPRITE.pad, '0') + SPRITE.ext;
        }
        const framePaths = [];
        for (let i = 1; i <= SPRITE.frameCount; i++) framePaths.push(framePath(i));
        const bitmaps = [];
        Promise.all(
          framePaths.map(async (path) => {
            const res = await fetch(path);
            const blob = await res.blob();
            return await createImageBitmap(blob);
          })
        ).then((results) => {
          bitmaps.push(...results);
          console.log('序列帧全部就绪（' + bitmaps.length + ' 帧）');
          canvas.width = bitmaps[0].width;
          canvas.height = bitmaps[0].height;
          ctx.drawImage(bitmaps[0], 0, 0);
          layer.style.display = 'block';
          startPlayback();
        }).catch((err) => {
          console.error('序列帧加载失败：', err);
          window.__spriteDoneFlag = true;
          if (window.__onSpriteDone) window.__onSpriteDone();
        });
        function startPlayback() {
          if (SPRITE.fadeIn > 0) {
            layer.style.opacity = '0';
            layer.style.transition = `opacity ${SPRITE.fadeIn}s ease`;
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                layer.style.opacity = '1';
              });
            });
          } else {
            layer.style.opacity = '1';
          }
          let index = 0;
          const interval = 1000 / SPRITE.fps;
          let lastTime = performance.now();
          function tick(now) {
            requestAnimationFrame(tick);
            const elapsed = now - lastTime;
            if (elapsed < interval) return;
            if (elapsed > interval * 3) {
              lastTime = now;
            } else {
              lastTime += interval;
            }
            index++;
            if (index >= bitmaps.length) {
              if (SPRITE.loop) {
                index = 0;
              } else {
                window.__spriteDoneFlag = true;
                if (window.__onSpriteDone) window.__onSpriteDone();
                return;
              }
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bitmaps[index], 0, 0);
          }
          requestAnimationFrame(tick);
        }
      })();
    </script>
    <script>
      window.__modelPromise = fetch('./wjy1.glb').then(function (res) {
        if (!res.ok) throw new Error('模型请求失败：HTTP ' + res.status);
        return res.arrayBuffer();
      });
    </script>
    <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
      import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';
      const LOADING = {
        parseModelAt: 1100,
      };
      window.LOADING = LOADING;
      const GAZE = {
        enabled: true,
        leftBoneName: 'eyeL',
        rightBoneName: 'eyeR',
        smooth: 0.80,
        mouseRange: 1.5,
        horizontalAxis: 'x',
        verticalAxis: 'y',
        horizontalFlip: false,
        verticalFlip: false,
        horizontalScale: 1.5,
        verticalScale: 0.8,
        moveAmount: 0.05,
        eyeSeparation: 0.15,
      };
      window.GAZE = GAZE;
      const HIGHLIGHT = {
        enabled: true,
        color: '#ffeeee',
        intensity: 0.06,
        distance: 0.0005,
        decay: 2,
        followDistance: 0.5,
        offsetX: 0.0,
        offsetY: 0.0,
        smooth: 0.25,
      };
      window.HIGHLIGHT = HIGHLIGHT;
      function cssVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }
      const COLORS = {
        bgTop: cssVar('--bg-top'),
        bgBottom: cssVar('--bg-bottom'),
        keyLight: cssVar('--light-key'),
        fillLight: cssVar('--light-fill'),
        ambientLight: cssVar('--light-ambient'),
        outline: cssVar('--outline'),
        materialFallback: cssVar('--material-fallback'),
        clear: cssVar('--clear'),
      };
      function colorToRgb01(hex) {
        const c = new THREE.Color(hex);
        return [c.r, c.g, c.b];
      }
      /*相机*/
      const VIEW = {
        fov: 45,
        position: { x: 0, y: 1.39, z: 0.85 },
        rotation: { x: 0, y: 5, z: 0 },
        lookAtModel: false,
        lookAtHeight: 0.55,
      };
      const LIGHT = {
        key: { position: { x: 0.8, y: 2, z: 5 }, intensity: 1.3, castShadow: true },
        fill: { position: { x: 5, y: 3, z: -4 }, intensity: 1.2 },
        ambient: { intensity: 2 },
        envIntensity: 0.35,
        targetHeightRatio: 0.5,
      };
      const TOON = {
        steps: 3,
        outlineThickness: 0.0025,
        outlineAlpha: 1.0,
      };
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(new THREE.Color(COLORS.clear), 0);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.NoToneMapping;
      renderer.toneMappingExposure = 1.0;
      document.body.appendChild(renderer.domElement);
      const effect = new OutlineEffect(renderer, {
        defaultThickness: TOON.outlineThickness,
        defaultColor: colorToRgb01(COLORS.outline),
        defaultAlpha: TOON.outlineAlpha,
        defaultKeepAlive: true,
        defaultVisible: true,
      });
      const scene = new THREE.Scene();
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = LIGHT.envIntensity;
      const camera = new THREE.PerspectiveCamera(
        VIEW.fov, window.innerWidth / window.innerHeight, 0.1, 1000
      );
      scene.add(new THREE.AmbientLight(
        new THREE.Color(COLORS.ambientLight), LIGHT.ambient.intensity
      ));
      const keyLight = new THREE.DirectionalLight(
        new THREE.Color(COLORS.keyLight), LIGHT.key.intensity
      );
      keyLight.position.set(LIGHT.key.position.x, LIGHT.key.position.y, LIGHT.key.position.z);
      keyLight.castShadow = LIGHT.key.castShadow;
      keyLight.shadow.mapSize.set(2048, 2048);
      keyLight.shadow.bias = -0.0005;
      scene.add(keyLight);
      scene.add(keyLight.target);
      const fillLight = new THREE.DirectionalLight(
        new THREE.Color(COLORS.fillLight), LIGHT.fill.intensity
      );
      fillLight.position.set(LIGHT.fill.position.x, LIGHT.fill.position.y, LIGHT.fill.position.z);
      scene.add(fillLight);
      const highlightLight = new THREE.PointLight(
        new THREE.Color(HIGHLIGHT.color),
        HIGHLIGHT.intensity,
        HIGHLIGHT.distance,
        HIGHLIGHT.decay
      );
      highlightLight.visible = HIGHLIGHT.enabled;
      scene.add(highlightLight);
      highlightLight.position.set(0, 1.2, 1);
      function makeToonGradient(steps) {
        const data = new Uint8Array(steps * 4);
        for (let i = 0; i < steps; i++) {
          const v = Math.round(((i + 0.6) / steps) * 255);
          data[i * 4 + 0] = v;
          data[i * 4 + 1] = v;
          data[i * 4 + 2] = v;
          data[i * 4 + 3] = 255;
        }
        const tex = new THREE.DataTexture(data, steps, 1, THREE.RGBAFormat);
        tex.minFilter = THREE.NearestFilter;
        tex.magFilter = THREE.NearestFilter;
        tex.generateMipmaps = false;
        tex.needsUpdate = true;
        return tex;
      }
      const toonGradient = makeToonGradient(TOON.steps);
      const mouseNDC = { x: 0, y: 0 };
      window.addEventListener('mousemove', (e) => {
        mouseNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
      });
      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          const t = e.touches[0];
          mouseNDC.x = (t.clientX / window.innerWidth) * 2 - 1;
          mouseNDC.y = -(t.clientY / window.innerHeight) * 2 + 1;
        }
      }, { passive: true });
      const _highlightTarget = new THREE.Vector3();
      let _highlightInited = false;
      function updateHighlight() {
        if (!HIGHLIGHT.enabled) return;
        _highlightTarget.set(mouseNDC.x, mouseNDC.y, 0.5);
        _highlightTarget.unproject(camera);
        _highlightTarget.sub(camera.position).normalize();
        const targetPos = camera.position.clone().addScaledVector(
          _highlightTarget, HIGHLIGHT.followDistance
        );
        if (!_highlightInited) {
          highlightLight.position.copy(targetPos);
          _highlightInited = true;
        } else {
          highlightLight.position.lerp(targetPos, HIGHLIGHT.smooth);
        }
      }
      let leftBone = null;
      let rightBone = null;
      let leftPos0 = null;
      let rightPos0 = null;
      let curMouseX = 0;
      let curMouseY = 0;
      function setupGaze(model) {
        leftBone = model.getObjectByName(GAZE.leftBoneName);
        rightBone = model.getObjectByName(GAZE.rightBoneName);
        if (leftBone) leftPos0 = leftBone.position.clone();
        if (rightBone) rightPos0 = rightBone.position.clone();
        console.log('左眼骨骼：', leftBone ? leftBone.name : '× 未找到');
        console.log('右眼骨骼：', rightBone ? rightBone.name : '× 未找到');
      }
      function updateGaze() {
        if (!GAZE.enabled || !leftBone || !rightBone || !leftPos0 || !rightPos0) return;
        const sx = GAZE.invertX ? -1 : 1;
        const sy = GAZE.invertY ? -1 : 1;
        curMouseX += (mouseNDC.x * sx - curMouseX) * GAZE.smooth;
        curMouseY += (mouseNDC.y * sy - curMouseY) * GAZE.smooth;
        const mx = curMouseX * GAZE.mouseRange;
        const my = curMouseY * GAZE.mouseRange;
        const amt = GAZE.moveAmount;
        const hSign = GAZE.horizontalFlip ? -1 : 1;
        const vSign = GAZE.verticalFlip ? -1 : 1;
        const hScale = GAZE.horizontalScale;
        const vScale = GAZE.verticalScale;
        const hAxis = GAZE.horizontalAxis;
        const vAxis = GAZE.verticalAxis;
        const sep = GAZE.eyeSeparation;
        let ldx = (mx + sep) * hScale * hSign;
        let ldy = my * vScale * vSign;
        leftBone.position.copy(leftPos0);
        if (hAxis) leftBone.position[hAxis] += ldx * amt;
        if (vAxis) leftBone.position[vAxis] += ldy * amt;
        let rdx = (mx - sep) * hScale * hSign;
        let rdy = my * vScale * vSign;
        rightBone.position.copy(rightPos0);
        if (hAxis) rightBone.position[hAxis] += rdx * amt;
        if (vAxis) rightBone.position[vAxis] += rdy * amt;
      }
            // ========= 鼠标视差相机配置 =========
      const parallaxStrength = 0.07; // 视差幅度，越小越轻微，推荐0.05~0.12
      const camOriginPos = new THREE.Vector3(VIEW.position.x, VIEW.position.y, VIEW.position.z);
      const lookCenter = new THREE.Vector3(0, 1.27, 0); // 相机一直看向人物中心点

      const clock = new THREE.Clock();
      let mixer = null;
            renderer.setAnimationLoop(() => {
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        // ====== 相机视差逻辑 ======
        // 限制最大偏移，防止鼠标到边角偏移过大
        const offsetX = THREE.MathUtils.clamp(mouseNDC.x * parallaxStrength, -0.07, 0.07);
        const offsetY = THREE.MathUtils.clamp(mouseNDC.y * parallaxStrength, -0.07, 0.07);
        const targetCamPos = new THREE.Vector3(
          camOriginPos.x + offsetX,
          camOriginPos.y + offsetY,
          camOriginPos.z
        );
        // 平滑插值
        camera.position.lerp(targetCamPos, 0.06);
        // 相机始终看向模型中心
        camera.lookAt(lookCenter);
        // ==========================

        updateGaze();
        updateHighlight();
        effect.render(scene, camera);
      });

      /* ==================== 等待序列帧 / 时间点 ==================== */
      console.log('等待中…（将在 ' + LOADING.parseModelAt + 'ms 后开始解析模型）');
      await new Promise((resolve) => {
        const check = () => {
          if (window.__spriteDoneFlag) {
            console.log('序列帧已播完，开始解析模型');
            return resolve();
          }
          const elapsed = performance.now() - window.__pageStartTime;
          if (elapsed >= LOADING.parseModelAt) {
            console.log('到达时间点（' + elapsed.toFixed(0) + 'ms），开始解析模型');
            return resolve();
          }
          requestAnimationFrame(check);
        };
        check();
      });
      const loader = new GLTFLoader();
      const draco = new DRACOLoader();
      draco.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');
      loader.setDRACOLoader(draco);
      try {
        const arrayBuffer = await window.__modelPromise;
        loader.parse(arrayBuffer, './', onModelLoaded, onLoadError);
      } catch (err) {
        onLoadError(err);
      }
      function onLoadError(err) {
        console.error('模型加载失败：', err);
        // 加载失败也把加载模糊淡出，避免卡住
        if (window.clearLoadBlur) window.clearLoadBlur();
      }
      function onModelLoaded(gltf) {
        const model = gltf.scene;
        model.traverse((obj) => {
          if (!obj.isMesh) return;
          obj.castShadow = true;
          obj.receiveShadow = true;
          obj.frustumCulled = false;
          const oldMats = Array.isArray(obj.material) ? obj.material : [obj.material];
          const newMats = oldMats.map((old) => {
            const toon = new THREE.MeshToonMaterial({
              map: old.map || null,
              color: old.color ? old.color.clone() : new THREE.Color(COLORS.materialFallback),
              gradientMap: toonGradient,
              alphaTest: old.alphaTest || 0,
              transparent: old.transparent || false,
              opacity: old.opacity !== undefined ? old.opacity : 1,
              side: old.side,
            });
            if (toon.map) toon.map.colorSpace = THREE.SRGBColorSpace;
            toon.userData.outlineParameters = {
              thickness: TOON.outlineThickness,
              color: colorToRgb01(COLORS.outline),
              alpha: TOON.outlineAlpha,
              visible: true,
              keepAlive: true,
            };
            return toon;
          });
          obj.material = Array.isArray(obj.material) ? newMats : newMats[0];
        });
        const junk = [];
        model.traverse((obj) => {
          if (!obj.isMesh) return;
          if (/background|bg_?box|sky|dome|sphere|room|stage|floor|ground|groundplane|shadow_?plane/i.test(obj.name)) {
            junk.push(obj);
          }
        });
        junk.forEach((o) => o.parent && o.parent.remove(o));
        scene.add(model);
        const box0 = new THREE.Box3().setFromObject(model);
        const c0 = box0.getCenter(new THREE.Vector3());
        model.position.x -= c0.x;
        model.position.z -= c0.z;
        model.position.y -= box0.min.y;
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        camera.position.set(VIEW.position.x, VIEW.position.y, VIEW.position.z);
        if (VIEW.lookAtModel) {
          const lookY = box.min.y + size.y * VIEW.lookAtHeight;
          camera.lookAt(0, lookY, 0);
        } else {
          camera.rotation.set(
            THREE.MathUtils.degToRad(VIEW.rotation.x),
            THREE.MathUtils.degToRad(VIEW.rotation.y),
            THREE.MathUtils.degToRad(VIEW.rotation.z),
            'XYZ'
          );
        }
        camera.near = maxDim / 100;
        camera.far = maxDim * 100;
        camera.updateProjectionMatrix();
        const d = maxDim * 0.75 + 1;
        const sc = keyLight.shadow.camera;
        sc.left = -d; sc.right = d; sc.top = d; sc.bottom = -d;
        sc.near = 0.1; sc.far = maxDim * 50;
        sc.updateProjectionMatrix();
        const targetY = LIGHT.targetHeightRatio !== null
          ? size.y * LIGHT.targetHeightRatio
          : size.y * 0.5;
        keyLight.target.position.set(0, targetY, 0);
        keyLight.target.updateMatrixWorld();
        HIGHLIGHT.distance = maxDim * 0.8;
        highlightLight.distance = HIGHLIGHT.distance;
        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(model);
          gltf.animations.forEach((clip) => {
            const action = mixer.clipAction(clip);
            action.setLoop(THREE.LoopRepeat, Infinity);
            action.clampWhenFinished = false;
            action.play();
          });
          console.log('动画片段：', gltf.animations.map((c) => c.name));
        }
        setupGaze(model);
        console.log('模型加载完成 ✔ 尺寸：', size.toArray());
        /* ★ 触发加载模糊淡出 */
        if (window.clearLoadBlur) window.clearLoadBlur();
      }
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
</body>

</html>
