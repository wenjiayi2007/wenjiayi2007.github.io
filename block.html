<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>光启</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.8;
            color: #333;
            background-color: #fafafa;
        }

        h1 { border-bottom: 2px solid #eee; padding-bottom: 15px; margin-top: 30px; color: #2c3e50; }
        h2 { margin-top: 40px; color: #2c3e50; border-left: 4px solid #0066cc; padding-left: 12px; }
        p { margin: 15px 0; }
        /* ================= 导航栏 ================= */
        .sticky-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: transparent;
            padding: 20px 30px 10px 30px;
            z-index: 1000;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            box-sizing: border-box;
        }

        /* 左侧和右侧的容器 */
        .header-left,
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* 左上角返回主页按钮 */
        .back-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 999px;
            font-size: 13px;
            letter-spacing: 1px;
            text-decoration: none;
            transition: 0.25s ease;
            cursor: pointer;
            z-index: 1001;
        }

        .back-btn:hover {
            transform: translate(4px, -3px);
            background: rgba(255, 255, 255, 0.5);
        }

        .back-btn::before,
        .back-btn::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid #ffffff;
            border-radius: 999px;
            transition: 0.25s ease;
            opacity: 0;
            pointer-events: none;
        }

        .back-btn:hover::before {
            opacity: 0.4;
            transform: translate(-3px, 1.5px);
        }

        .back-btn:hover::after {
            opacity: 0.15;
            transform: translate(-4px, 5px);
        }

        /* ================= 右侧菜单容器 ================= */
        .header-right {
            position: relative; 
        }

        /* 导航链接列表（电脑端水平排布） */
        .nav-menu {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* ================= 汉堡菜单按钮 ================= */
        .burger-menu {
            display: none;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 2px solid rgba(0, 0, 0, 0.6);
            border-radius: 999px;
            padding: 0;
            cursor: pointer;
            position: relative; /* 绝对定位的参考系 */
            width: 40px;
            height: 34px;
            box-sizing: border-box;
            z-index: 1001;
            transition: background 0.25s ease;
        }

        /* 三条横线的基础样式 */
        .burger-menu span {
            display: block;
            position: absolute;
            left: 50%;
            width: 18px;     
            height: 2px;     
            background-color: #333;
            transform: translateX(-50%); /* 完美水平居中 */
            transition: transform 0.3s ease, opacity 0.3s ease, top 0.3s ease;
        }

        /* 默认三条线的位置 */
        .burger-menu span:nth-child(1) { top: 9px; }
        .burger-menu span:nth-child(2) { top: 15px; }
        .burger-menu span:nth-child(3) { top: 21px; }

        /* 👇 变形为叉叉的动画 👇 */
        .burger-menu.active span:nth-child(1) {
            top: 15px; 
            transform: translateX(-50%) rotate(45deg); 
        }
        .burger-menu.active span:nth-child(2) {
            opacity: 0; 
        }
        .burger-menu.active span:nth-child(3) {
            top: 15px; 
            transform: translateX(-50%) rotate(-45deg); 
        }

        .burger-menu:hover {
            background: rgba(255, 255, 255, 0.8);
        }


        :root {
            /* 网页和场景的背景色 */
            --bg-color: #191f2e;

            /* 环境光（常数光，托底用，无高光） */
            --ambient-color: #ffffff;
            --ambient-intensity: 0.8;

            /* 相机光（跟随鼠标/手指的手电筒，产生唯一的高光） */
            --camera-light-color: #fffdf0;
            --camera-light-intensity: 1.0;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            cursor: pointer;
            /* 禁止移动端长按选中文本 */
            -webkit-user-select: none;
            user-select: none;
            /* 禁止移动端默认的触摸滚动/缩放行为 */
            touch-action: none;
        }
        /* ================= 响应式设计（手机端适配） ================= */
        @media screen and (max-width: 768px) {
            /* 显示汉堡按钮 */
            .burger-menu { display: block; }

            /* 下拉菜单面板（白底大框） */
            .nav-menu {
                display: block;
                visibility: hidden;
                opacity: 0;
                position: absolute;
                top: 50px;
                right: 0;
                background-color: #ffffff;
                box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.15); 
                border-radius: 12px;
                min-width: 160px;
                padding: 8px 0;
                z-index: 10000;
                transform: translateY(-10px);
                transition: all 0.3s ease;
            }

            /* 展开状态 */
            .nav-menu.active {
                visibility: visible;
                opacity: 1;
                transform: translateY(0);
            }

            /* 列表文字样式 */
            .nav-menu .back-btn {
                display: block;
                width: 100%;
                padding: 12px 20px;
                box-sizing: border-box;
                background: transparent;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                border: none;
                border-radius: 0;
                color: #333333;
                font-size: 15px;
                text-align: left;
                transform: none;
            }

            /* 取消原本按钮的伪元素（避免手机上出现奇怪边框） */
            .nav-menu .back-btn::before, 
            .nav-menu .back-btn::after { display: none; }

            /* 列表文字悬停反馈 */
            .nav-menu .back-btn:hover {
                background-color: #f2f2f2;
                color: #000000;
                transform: none;
            }
        }

        /* 👇 解决移动端点击后卡住 Hover 状态 👇 */
        @media (hover: none) and (pointer: coarse) {
            .top-btn:hover {
                transform: none !important; 
                background: rgba(255, 255, 255, 0.4) !important;
            }
            .top-btn:hover::before, .top-btn:hover::after {
                opacity: 0 !important;
                transform: none !important;
            }
            .back-btn:hover {
                transform: none !important;
                background: rgba(255, 255, 255, 0.4) !important;
            }
            .back-btn:hover::before, .back-btn:hover::after {
                opacity: 0 !important;
                transform: none !important;
            }
        }
    </style>
</head>

<body>
    <!-- 顶部锚点 -->
    <div id="top-anchor"></div>

    <div class="sticky-header">
        <!-- 左侧盒子：放返回主页 -->
        <div class="header-left">
            <a href="index.html" class="back-btn">
                返回主页
            </a>
        </div>

        <!-- 右侧盒子：以后想加多少按钮，就在这里写多少个 <a> 标签 -->
        <div class="header-right">
            <a href="block.html" class="back-btn">
                光启
            </a>
            <a href="Unity Shader.html" class="back-btn">
                Unity Shader
            </a>
            <a href="GAMES101.html" class="back-btn">
                GAMES101
            </a>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'https://unpkg.com/three@0.128.0/examples/jsm/loaders/GLTFLoader.js';

        const scene = new THREE.Scene();

        // 读取 CSS 变量
        const rootStyle = getComputedStyle(document.documentElement);
        const cssBgColor = rootStyle.getPropertyValue('--bg-color').trim();
        const cssAmbientColor = rootStyle.getPropertyValue('--ambient-color').trim();
        const cssAmbientIntensity = parseFloat(rootStyle.getPropertyValue('--ambient-intensity').trim());
        const cssCameraLightColor = rootStyle.getPropertyValue('--camera-light-color').trim();
        const cssCameraLightIntensity = parseFloat(rootStyle.getPropertyValue('--camera-light-intensity').trim());

        scene.background = new THREE.Color(cssBgColor);
        scene.environment = null;

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);

        // 初始相机坐标
        const INITIAL_CAMERA_X = -25;
        const INITIAL_CAMERA_Y = 30;
        const INITIAL_CAMERA_Z = 60;

        let cameraDistance = Math.sqrt(INITIAL_CAMERA_X ** 2 + INITIAL_CAMERA_Y ** 2 + INITIAL_CAMERA_Z ** 2);
        let targetDistance = cameraDistance;

        let phi = Math.acos(INITIAL_CAMERA_Y / cameraDistance);
        let targetPhi = phi;

        let theta = Math.atan2(INITIAL_CAMERA_X, INITIAL_CAMERA_Z);
        let targetTheta = theta;

        const sensitivityX = 0.002;
        const sensitivityY = 0.002;

        // 移动端灵敏度
        const touchSensitivityX = 0.005;
        const touchSensitivityY = 0.005;

        // ========================================================
        // 【桌面端控制】
        // ========================================================
        document.body.addEventListener('click', () => {
            if (document.body.requestPointerLock) {
                document.body.requestPointerLock();
            }
        });

        document.addEventListener('mousemove', (event) => {
            if (document.pointerLockElement === document.body) {
                targetTheta -= event.movementX * sensitivityX;
                targetPhi -= event.movementY * sensitivityY;
                targetPhi = Math.max(0.1, Math.min(targetPhi, Math.PI - 0.1));
            }
        });

        // ========================================================
        // 【移动端控制：手指滑动与缩放】
        // ========================================================
        let touchStart = { x: 0, y: 0, distance: 0 };

        document.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                // 单指：记录起点
                touchStart.x = e.touches[0].clientX;
                touchStart.y = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                // 双指：记录两指初始距离
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                touchStart.distance = Math.sqrt(dx * dx + dy * dy);
            }
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            e.preventDefault(); // 阻止页面滚动

            if (e.touches.length === 1) {
                // 单指：计算滑动距离并旋转视角
                const deltaX = e.touches[0].clientX - touchStart.x;
                const deltaY = e.touches[0].clientY - touchStart.y;

                targetTheta -= deltaX * touchSensitivityX;
                targetPhi -= deltaY * touchSensitivityY;
                targetPhi = Math.max(0.1, Math.min(targetPhi, Math.PI - 0.1));

                // 更新起点，用于下一次滑动
                touchStart.x = e.touches[0].clientX;
                touchStart.y = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                // 双指：计算距离变化并缩放
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const currentDistance = Math.sqrt(dx * dx + dy * dy);

                // 相比之前变大了就是拉开（放大），变小了就是捏合（缩小）
                const distanceDelta = touchStart.distance - currentDistance;
                targetDistance += distanceDelta * 0.5; // 缩放速度调节
                targetDistance = Math.max(10, Math.min(targetDistance, 150));

                touchStart.distance = currentDistance;
            }
        }, { passive: false });

        // 滚轮缩放（桌面端）
        document.addEventListener('wheel', (event) => {
            targetDistance += event.deltaY * 0.05;
            targetDistance = Math.max(10, Math.min(targetDistance, 150));
        });

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        document.body.appendChild(renderer.domElement);

        // 光照
        const ambientLight = new THREE.AmbientLight(cssAmbientColor, cssAmbientIntensity);
        scene.add(ambientLight);

        const cameraLight = new THREE.DirectionalLight(cssCameraLightColor, cssCameraLightIntensity);
        cameraLight.position.set(5, 10, 5);
        cameraLight.castShadow = true;

        cameraLight.shadow.camera.top = 50;
        cameraLight.shadow.camera.bottom = -50;
        cameraLight.shadow.camera.left = -50;
        cameraLight.shadow.camera.right = 50;
        cameraLight.shadow.mapSize.width = 2048;
        cameraLight.shadow.mapSize.height = 2048;
        cameraLight.shadow.bias = -0.001;

        camera.add(cameraLight);
        scene.add(camera);

        // --- 加载模型 ---
        const loader = new GLTFLoader();
        const clock = new THREE.Clock();
        const doorsToRotate = [];

        loader.load(
            './block.glb',
            (gltf) => {
                const model = gltf.scene;

                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;

                        const materials = Array.isArray(child.material) ? child.material : [child.material];

                        materials.forEach(mat => {
                            mat.side = THREE.DoubleSide;
                            mat.polygonOffset = true;
                            mat.polygonOffsetFactor = 1;
                            mat.polygonOffsetUnits = 1;

                            if (mat.transparent) {
                                if (child.name.includes('玻璃') || mat.name.includes('glass')) {
                                    mat.transparent = true;
                                    mat.alphaTest = 0;
                                    mat.depthWrite = false;
                                    child.renderOrder = 3;
                                } else {
                                    mat.transparent = false;
                                    mat.alphaTest = 0.5;
                                    mat.depthWrite = true;
                                    child.renderOrder = 2;
                                }
                            } else {
                                child.renderOrder = 0;
                            }
                        });
                    }

                    if (child.name === '门南' || child.name === '门北') {
                        if (child.animations && child.animations.length > 0) {
                            child.animations = [];
                        }
                        doorsToRotate.push(child);
                    }
                });

                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());

                model.position.x -= center.x;
                model.position.y -= center.y;
                model.position.z -= center.z;

                scene.add(model);
            },
            undefined,
            (error) => {
                console.error('模型加载失败:', error);
            }
        );

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            const doorRotationSpeed = 0.8;
            if (doorsToRotate.length > 0) {
                doorsToRotate.forEach(door => {
                    door.rotation.y += doorRotationSpeed * delta;
                });
            }

            // 阻尼插值，丝滑过渡
            theta += (targetTheta - theta) * 0.1;
            phi += (targetPhi - phi) * 0.1;
            cameraDistance += (targetDistance - cameraDistance) * 0.1;

            camera.position.x = cameraDistance * Math.sin(phi) * Math.sin(theta);
            camera.position.y = cameraDistance * Math.cos(phi);
            camera.position.z = cameraDistance * Math.sin(phi) * Math.cos(theta);

            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        animate();
         function toggleMenu() {
            var menu = document.getElementById("myMenu");
            var burger = document.getElementById("burgerBtn");
            
            // 切换下拉菜单
            menu.classList.toggle("active");
            // 切换汉堡按钮为叉叉
            burger.classList.toggle("active");
        }

        // 点击页面空白处自动收起菜单
        document.addEventListener('click', (e) => {
            var menu = document.getElementById("myMenu");
            var burger = document.getElementById("burgerBtn");
            
            // 如果菜单是展开的，且点击的区域不是菜单和汉堡按钮本身
            if (menu.classList.contains('active') && !e.target.closest('.header-right')) {
                menu.classList.remove('active');
                burger.classList.remove('active'); // 顺便把叉叉变回三条杠
            }
        });

        // 👇 点击菜单里的任何一个链接后，自动关闭菜单 👇
        document.querySelectorAll('.nav-menu .back-btn').forEach(item => {
            item.addEventListener('click', () => {
                document.getElementById("myMenu").classList.remove("active");
                document.getElementById("burgerBtn").classList.remove("active");
            });
        });

        // ================== 折叠面板逻辑 ==================
        const titles = document.querySelectorAll('.collapse-title');
        const topBtn = document.getElementById('topBtn');

        titles.forEach((title) => {
            title.addEventListener('click', () => {
                title.classList.toggle('collapsed');
                const body = title.nextElementSibling;
                body.classList.toggle('collapsed');
            });
        });

        // 点击回到顶部按钮
        topBtn.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    </script>
</body>

</html>
