<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光启</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #151515; cursor: pointer; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'https://unpkg.com/three@0.128.0/examples/jsm/loaders/GLTFLoader.js';
        import { RoomEnvironment } from 'https://unpkg.com/three@0.128.0/examples/jsm/environments/RoomEnvironment.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x151515); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        let theta = 0;  
        let phi = Math.PI / 3; 
        let targetDistance = 60;
        let cameraDistance = 60; 
        let targetTheta = 0;
        let targetPhi = Math.PI / 3;

        const sensitivityX = 0.002; 
        const sensitivityY = 0.002; 

        document.body.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('mousemove', (event) => {
            if (document.pointerLockElement === document.body) {
                targetTheta -= event.movementX * sensitivityX;
                targetPhi -= event.movementY * sensitivityY;
                targetPhi = Math.max(0.1, Math.min(targetPhi, Math.PI - 0.1));
            }
        });

        document.addEventListener('wheel', (event) => {
            targetDistance += event.deltaY * 0.05;
            targetDistance = Math.max(10, Math.min(targetDistance, 150));
        });

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        
        document.body.appendChild(renderer.domElement);

        // ========================================================
        // 【核心修改区】纯常数环境光 + 相机跟随探照灯（带阴影）
        // ========================================================

        // 1. 彻底废除固定光，改用纯常数环境光。
        // 强度给 0.6，保证你看不到的地方（背光面）依然有均匀的亮度，且绝对不反光。
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
        scene.add(ambientLight);

        // 2. 相机跟随光（主光源）：不仅跟着跑，还要负责投下真实的阴影
        const cameraLight = new THREE.DirectionalLight(0xffffff, 1.2);
        cameraLight.position.set(10, 20, 10); 
        cameraLight.castShadow = true; // 开启阴影！
        
        // 配置阴影相机范围（确保能覆盖你的房子）
        cameraLight.shadow.camera.top = 50;
        cameraLight.shadow.camera.bottom = -50;
        cameraLight.shadow.camera.left = -50;
        cameraLight.shadow.camera.right = 50;
        cameraLight.shadow.mapSize.width = 2048;
        cameraLight.shadow.mapSize.height = 2048;
        cameraLight.shadow.bias = -0.001; 
        
        camera.add(cameraLight);

        // 3. （可选）相机上的微弱补光，保证极暗角落能看清，不带阴影
        const cameraFillLight = new THREE.DirectionalLight(0xffffff, 0.3);
        cameraFillLight.position.set(-10, 10, -10);
        camera.add(cameraFillLight);

        scene.add(camera);

        // --- 加载模型 ---
        const loader = new GLTFLoader();
        const clock = new THREE.Clock(); 
        const doorsToRotate = [];

        loader.load(
            './block.glb',
            (gltf) => {
                const model = gltf.scene;

                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;

                        const materials = Array.isArray(child.material) ? child.material : [child.material];
                        
                        materials.forEach(mat => {
                            mat.side = THREE.DoubleSide;
                            mat.polygonOffset = true;
                            mat.polygonOffsetFactor = 1;
                            mat.polygonOffsetUnits = 1;

                            if (mat.transparent) {
                                if (child.name.includes('玻璃') || mat.name.includes('glass')) {
                                    mat.transparent = true;  
                                    mat.alphaTest = 0;
                                    mat.depthWrite = false;  
                                    child.renderOrder = 3;   
                                } else {
                                    mat.transparent = false; 
                                    mat.alphaTest = 0.5;     
                                    mat.depthWrite = true;   
                                    child.renderOrder = 2;   
                                }
                            } else {
                                child.renderOrder = 0; 
                            }
                        });
                    }
                    
                    if (child.name === '门南' || child.name === '门北') {
                        if (child.animations && child.animations.length > 0) {
                            child.animations = [];
                        }
                        doorsToRotate.push(child);
                    }
                });

                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                
                model.position.x -= center.x;
                model.position.y -= center.y;
                model.position.z -= center.z;

                scene.add(model);
            },
            undefined, 
            (error) => {
                console.error('模型加载失败:', error);
            }
        );

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta(); 
            
            const doorRotationSpeed = 0.8; 
            if (doorsToRotate.length > 0) {
                doorsToRotate.forEach(door => {
                    door.rotation.y += doorRotationSpeed * delta;
                });
            }

            theta += (targetTheta - theta) * 0.1;
            phi += (targetPhi - phi) * 0.1;
            cameraDistance += (targetDistance - cameraDistance) * 0.1;

            camera.position.x = cameraDistance * Math.sin(phi) * Math.sin(theta);
            camera.position.y = cameraDistance * Math.cos(phi);
            camera.position.z = cameraDistance * Math.sin(phi) * Math.cos(theta);

            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
